<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Comment Analyzer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- Chart.js (Natijalar sahifasi uchun) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header class="glass-panel main-header">
            <div class="logo">
                <span class="emoji">📊</span>
                <h1>InstaAnalyze AI</h1>
            </div>
            <p class="subtitle">Instagram kommentariyalarini sun'iy intellekt yordamida tahlil qiling</p>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
        
        <footer class="glass-panel main-footer">
            <p>&copy; 2026 Instagram Comment Analyzer. AI tomonidan quvvatlanadi.</p>
        </footer>
    </div>

    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
